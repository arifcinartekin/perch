name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (Chrome)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Package
        run: |
          npm run zip
          npm run zip:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: perch-extension
          path: .output/*.zip
          if-no-files-found: error
