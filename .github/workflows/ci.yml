name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (Chrome)
        run: npm run build

      - name: Build (Firefox)
        run: npm run build:firefox

      - name: Build (server)
        run: npm run build:server

      - name: Build (web reader)
        run: npm run build:web

      - name: Package
        run: |
          npm run zip
          npm run zip:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: perch-extension
          path: .output/*.zip
          if-no-files-found: error
          # WXT writes to `.output/`; upload-artifact@v4 skips dot-folders unless told otherwise.
          include-hidden-files: true

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest

      - name: Build (release, unsigned)
        run: ./gradlew --no-configuration-cache :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: perch-android
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
