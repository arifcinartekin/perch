# The Xcode project is generated from this file: `xcodegen` in apps/ios (the
# generated Perch.xcodeproj is committed too, so Xcode opens it directly).
name: Perch
options:
  bundleIdPrefix: app.perch
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    # Set your team to run on a device (Signing & Capabilities in Xcode).
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    # Strings live in Perch/Support/Localizable.xcstrings (English and Turkish).
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  PerchKit:
    path: PerchKit
targets:
  Perch:
    type: application
    platform: iOS
    sources:
      - path: Perch
      - path: Shared
    dependencies:
      - package: PerchKit
      - target: PerchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.perch.ios
        PRODUCT_NAME: Perch
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Perch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Perch connects to your Perch Server when it runs on your local network.
        INFOPLIST_KEY_NSCameraUsageDescription: Perch uses the camera only to scan a sync chain's QR code.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Perch uses Face ID to unlock the app when you've turned on the app lock.
        INFOPLIST_FILE: Perch/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Perch/Support/Perch.entitlements
        ENABLE_PREVIEWS: YES
  # Home Screen and Lock Screen widgets; they read what the app writes to the
  # shared app group (Shared/WidgetSnapshot.swift) and never talk to the server.
  PerchWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PerchWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.perch.ios.widgets
        PRODUCT_NAME: PerchWidgets
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PerchWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Perch
        CODE_SIGN_ENTITLEMENTS: PerchWidgets/PerchWidgets.entitlements
        SKIP_INSTALL: YES
  # Drives the app in the simulator against a test server; see README.
  PerchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PerchUITests
    dependencies:
      - target: Perch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.perch.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Perch
schemes:
  Perch:
    build:
      targets:
        Perch: all
        PerchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PerchUITests
