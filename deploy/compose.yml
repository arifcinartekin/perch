# Perch Server and Caddy (automatic HTTPS) on one machine.
# setup.sh writes .env next to this file; update.sh rebuilds from the checkout.

name: perch

services:
  perch:
    image: perch/server
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PERCH_PUBLIC_URL: https://${PERCH_DOMAIN:?set PERCH_DOMAIN in .env}
      # personal: the server keeps libraries. hub: Perch accounts and shared notes only.
      PERCH_MODE: ${PERCH_MODE:-personal}
      PERCH_PURGE_LIBRARIES: ${PERCH_PURGE_LIBRARIES:-false}
      PERCH_SIGNUP: ${PERCH_SIGNUP:-invite}
      PERCH_SIGNUP_POW: ${PERCH_SIGNUP_POW:-0} # proof-of-work bits for signing up; 0 = none
      PERCH_FETCH_INTERVAL_MIN: ${PERCH_FETCH_INTERVAL_MIN:-30}
      PERCH_TRUST_PROXY: 'true' # Caddy sets X-Forwarded-For
      PERCH_CHAIN: ${PERCH_CHAIN:-false} # relay sync chains (see PERCH_SYNC_DOMAIN)
      # Email codes for signup and password reset. The key stays in this server's .env.
      PERCH_EMAIL: ${PERCH_EMAIL:-off} # resend | log | off
      PERCH_EMAIL_FROM: ${PERCH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Keys the hashes kept instead of email addresses. Set once, never change it.
      PERCH_EMAIL_KEY: ${PERCH_EMAIL_KEY:-}
      # Your privacy policy and terms, linked from sign-up and shared notes (optional).
      PERCH_PRIVACY_URL: ${PERCH_PRIVACY_URL:-}
      PERCH_TERMS_URL: ${PERCH_TERMS_URL:-}
    volumes:
      - ${PERCH_DATA:-/var/lib/perch}:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [perch]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      PERCH_DOMAIN: ${PERCH_DOMAIN}
      PERCH_SYNC_DOMAIN: ${PERCH_SYNC_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sync:/srv/sync:ro # the page a browser sees on the sync domain
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
