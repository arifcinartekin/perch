# Perch Server and Caddy (automatic HTTPS) on one machine.
# setup.sh writes .env next to this file. update.sh either rebuilds from the
# checkout, or (with PERCH_IMAGE set) runs the image CI built and attested for
# the checked-out commit.

name: perch

services:
  perch:
    image: ${PERCH_IMAGE:-perch/server}:${PERCH_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
      args:
        PERCH_COMMIT: ${PERCH_COMMIT:-}
    restart: unless-stopped
    environment:
      PERCH_PUBLIC_URL: https://${PERCH_DOMAIN:?set PERCH_DOMAIN in .env}
      # personal: the server keeps libraries. hub: Perch accounts and shared notes only.
      PERCH_MODE: ${PERCH_MODE:-personal}
      PERCH_PURGE_LIBRARIES: ${PERCH_PURGE_LIBRARIES:-false}
      PERCH_SIGNUP: ${PERCH_SIGNUP:-invite}
      PERCH_SIGNUP_POW: ${PERCH_SIGNUP_POW:-0} # proof-of-work bits for signing up; 0 = none
      PERCH_FETCH_INTERVAL_MIN: ${PERCH_FETCH_INTERVAL_MIN:-30}
      PERCH_TRUST_PROXY: 'true' # Caddy sets X-Forwarded-For
      PERCH_CHAIN: ${PERCH_CHAIN:-false} # relay sync chains (see PERCH_SYNC_DOMAIN)
      # Email codes for signup and password reset. The key stays in this server's .env.
      PERCH_EMAIL: ${PERCH_EMAIL:-off} # resend | log | off
      PERCH_EMAIL_FROM: ${PERCH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Keys the hashes kept instead of email addresses. Set once, never change it.
      PERCH_EMAIL_KEY: ${PERCH_EMAIL_KEY:-}
      # Your privacy policy and terms, linked from sign-up and shared notes (optional).
      PERCH_PRIVACY_URL: ${PERCH_PRIVACY_URL:-}
      PERCH_TERMS_URL: ${PERCH_TERMS_URL:-}
      # Where Perch accounts are managed, when it's its own address (account.perch.ws).
      PERCH_ACCOUNT_URL: ${PERCH_ACCOUNT_URL:-}
    volumes:
      - ${PERCH_DATA:-/var/lib/perch}:/data

  # A second, separate server in personal mode, for App Review and anyone
  # trying "Sync with a Perch Server" (PERCH_DEMO_DOMAIN, e.g. demo.perch.ws).
  # Its own database and folder; it shares nothing with the server above.
  # Started only when .env has COMPOSE_PROFILES=demo.
  perch-demo:
    profiles: [demo]
    image: ${PERCH_IMAGE:-perch/server}:${PERCH_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PERCH_PUBLIC_URL: https://${PERCH_DEMO_DOMAIN:-demo.invalid}
      PERCH_MODE: personal
      PERCH_SIGNUP: ${PERCH_DEMO_SIGNUP:-closed} # the first account is always allowed
      PERCH_FETCH_INTERVAL_MIN: 60
      PERCH_TRUST_PROXY: 'true'
      PERCH_PRIVACY_URL: ${PERCH_PRIVACY_URL:-}
      PERCH_TERMS_URL: ${PERCH_TERMS_URL:-}
    volumes:
      - ${PERCH_DEMO_DATA:-/var/lib/perch-demo}:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [perch]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      PERCH_DOMAIN: ${PERCH_DOMAIN}
      PERCH_SYNC_DOMAIN: ${PERCH_SYNC_DOMAIN:-}
      PERCH_DEMO_DOMAIN: ${PERCH_DEMO_DOMAIN:-}
      PERCH_ACCOUNT_DOMAIN: ${PERCH_ACCOUNT_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sync:/srv/sync:ro # the page a browser sees on the sync domain
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
